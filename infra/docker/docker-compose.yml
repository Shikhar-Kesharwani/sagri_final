version: '3.9'

services:
  # ── SAGRI FastAPI ML Backend ────────────────────────────
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: sagri_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - SUPABASE_URL=${SUPABASE_URL:-https://tnaoasoznlzmbkennoiy.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY:-}
    volumes:
      - app_data:/app/backend/data
      - app_logs:/app/backend/logs
    networks:
      - sagri_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Reverse Proxy (Nginx) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sagri_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sagri_network

volumes:
  app_data:
  app_logs:

networks:
  sagri_network:
    driver: bridge
