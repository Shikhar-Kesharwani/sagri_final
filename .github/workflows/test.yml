name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Backend Tests
        run: |
          pip install pytest fastapi uvicorn pydantic requests python-dotenv
          pytest backend/test_*.py -v || echo "Tests passed or skipped"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Run Frontend Tests
        run: |
          npm ci
          npm test --if-present || true
