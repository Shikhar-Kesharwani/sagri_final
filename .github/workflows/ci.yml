name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Docker Image
        run: docker build -t sagri-backend:ci .

      - name: Start Container and Perform Health Check
        run: |
          docker run -d --name sagri_ci_app -p 8000:8000 \
            -e SUPABASE_URL="https://tnaoasoznlzmbkennoiy.supabase.co" \
            -e SUPABASE_KEY="mock-key-for-ci" \
            sagri-backend:ci
          sleep 15
          curl -f http://localhost:8000/health || (docker logs sagri_ci_app && exit 1)

      - name: Cleanup
        if: always()
        run: docker rm -f sagri_ci_app || true
