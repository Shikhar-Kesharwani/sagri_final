version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports: ['8000:8000']
    env_file: .env
    networks: [app-network]
    healthcheck:
      test: ['CMD','curl','-f','http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  app-network:
    driver: bridge
